# Local development with hot reload. Open http://localhost:8000
#   docker compose -f compose.dev.yml up --build
# Values below are local-only development defaults, not secrets.
name: goyacht-dev

x-backend-env: &backend-env
  APP_ENV: development
  APP_URL: http://localhost:8000
  DATABASE_URL: postgres://goyacht:goyacht@postgres:5432/goyacht?sslmode=disable
  IDENTITY_ENCRYPTION_KEYS: dev:Z295YWNodC1sb2NhbC1kZXZlbG9wbWVudC1rZXktMzI=
  IDENTITY_ENCRYPTION_ACTIVE_KEY: dev
  S3_ENDPOINT: s3:8333
  S3_ACCESS_KEY: devaccess
  S3_SECRET_KEY: devsecret12345
  MEDIA_PUBLIC_URL: http://localhost:8000/media
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_TLS_MODE: none
  MAIL_FROM_ADDRESS: no-reply@goyacht.local
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
  MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
  MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}

services:
  postgres:
    image: postgres:18.6-bookworm
    environment: { POSTGRES_DB: goyacht, POSTGRES_USER: goyacht, POSTGRES_PASSWORD: goyacht }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goyacht"]
      interval: 5s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|\$${S3_ACCESS_KEY}|devaccess|" -e "s|\$${S3_SECRET_KEY}|devsecret12345|" -e "s|\$${S3_PUBLIC_BUCKET}|goyacht-public|" /config/s3.json.template > /tmp/s3.json
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json.template:/config/s3.json.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["8025:8025"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/livez"]
      interval: 10s

  migrate:
    build: { context: ./backend, target: dev }
    working_dir: /src
    command: ["go", "run", "./cmd/cli", "migrate", "up"]
    environment: *backend-env
    volumes: [./backend:/src, gocache:/root/.cache, gomod:/go/pkg/mod]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ./backend, target: dev }
    command: ["air", "-c", ".air.api.toml"]
    environment: *backend-env
    volumes: [./backend:/src, gocache:/root/.cache, gomod:/go/pkg/mod]
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      retries: 30

  worker:
    build: { context: ./backend, target: dev }
    command: ["air", "-c", ".air.worker.toml"]
    environment: *backend-env
    volumes: [./backend:/src, gocache:/root/.cache, gomod:/go/pkg/mod]
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      API_INTERNAL_URL: http://api:8080
      PUBLIC_APP_URL: http://localhost:8000
    volumes: [./frontend:/app, /app/node_modules]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      retries: 30

  caddy:
    image: caddy:2.11.7-alpine
    ports: ["8000:8000"]
    volumes: [./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro]
    depends_on: [api, frontend]

volumes:
  pgdata:
  s3data:
  gocache:
  gomod:
