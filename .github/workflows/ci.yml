name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Reject AI attribution trailers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || range="${{ github.sha }}"
          fi
          for c in $(git rev-list "$range"); do
            git log -1 --format=%B "$c" > /tmp/msg
            sh .githooks/commit-msg /tmp/msg || { echo "commit $c"; exit 1; }
          done

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: goyacht
          POSTGRES_PASSWORD: goyacht
          POSTGRES_DB: goyacht
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goyacht" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
      - name: Tests (unit and integration against PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://goyacht:goyacht@localhost:5432/goyacht?sslmode=disable
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target runtime -t goyacht-backend:ci backend
      - run: docker build --target runtime -t goyacht-frontend:ci frontend
      - run: docker build -t goyacht-backup:ci docker/backup
      - run: docker compose --env-file .env.example config -q
