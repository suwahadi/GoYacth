openapi: 3.1.0
info:
  title: GoYacht API
  version: "1.0.0"
  description: |
    REST API of the GoYacht platform. Successful responses are `{"data": ..., "meta": ...}`; errors are
    `{"error": {"code", "message", "fields"}}` with stable SCREAMING_SNAKE_CASE codes. Money is whole IDR
    (integer); percentages are basis points (10000 = 100%); timestamps are ISO 8601 UTC. Every response
    carries `X-Request-ID`. Cookie-authenticated mutations require the `X-CSRF-Token` header (value of the
    `gy_csrf` cookie). Public endpoints accept `?locale=en|id`. The path list is verified against the router
    by `internal/app/openapi_test.go`.
servers:
  - url: /
tags:
  - name: auth
  - name: bookingadmin
  - name: bookings
  - name: catalog
  - name: cms
  - name: departures
  - name: media
  - name: packages
  - name: payments
  - name: pricing
  - name: reports
  - name: reviews
  - name: settings
  - name: settlements
  - name: tickets
  - name: users
paths:
  /api/v1/account/bookings:
    get:
      tags: [bookings]
      operationId: get_account_bookings
      security: [{session: []}]
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/account/bookings/{id}:
    get:
      tags: [bookings]
      operationId: get_account_bookings_id_
      security: [{session: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Booking"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/account/delete:
    post:
      tags: [users]
      operationId: post_account_delete
      security: [{session: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
