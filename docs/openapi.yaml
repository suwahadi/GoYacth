components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: gy_session
  responses:
    Ok:
      description: Success envelope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Envelope"}
    Error:
      description: Error envelope (400, 401, 403, 404, 409, 410, 422, 429, 500)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
          properties:
            page: {type: integer}
            per_page: {type: integer}
            total: {type: integer}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: BOOKING_SLOT_TAKEN}
            message: {type: string}
            fields:
              type: object
              additionalProperties: {type: string}
              example: {"lead.phone": INVALID_PHONE}
    BookingStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, EXPIRED]
    BookingPaymentStatus:
      type: string
      enum: [UNPAID, DEPOSIT_PAID, PAID, PARTIALLY_REFUNDED, REFUNDED]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, EXPIRED, CANCELLED]
    RefundStatus:
      type: string
      enum: [REQUESTED, APPROVED, PROCESSING, COMPLETED, REJECTED]
    PaymentMethod:
      type: string
      enum: [CREDIT_CARD, QRIS, BCA_VA, BNI_VA, BRI_VA, MANDIRI_VA, PERMATA_VA]
    ProductInput:
      type: object
      required: [mode]
      properties:
        mode: {type: string, enum: [PRIVATE_CHARTER, DEPARTURE]}
        boat_id: {type: string, format: uuid}
        route_id: {type: string, format: uuid}
        date: {type: string, format: date, description: Departure port local date}
        start_time: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: Port local time, 15-minute steps}
        rate_unit: {type: string, enum: [HOURLY, DAILY, FIXED]}
        units: {type: integer}
        departure_slot_id: {type: string, format: uuid}
        package_id: {type: string, format: uuid}
        package_offering_id: {type: string, format: uuid}
    QuoteInput:
      type: object
      additionalProperties: false
      required: [product, pax]
      properties:
        product: {$ref: "#/components/schemas/ProductInput"}
        pax: {type: integer, minimum: 1}
        promo_code: {type: string}
        payment_method: {$ref: "#/components/schemas/PaymentMethod"}
        payment_scheme: {type: string, enum: [FULL, DEPOSIT]}
        locale: {type: string, enum: [en, id]}
    BookingCreateInput:
      description: Unknown fields (prices, totals, statuses) are rejected with 422 UNKNOWN_FIELD.
      allOf:
        - $ref: "#/components/schemas/QuoteInput"
        - type: object
          required: [lead, guests, consents, payment_method]
          properties:
            lead:
              type: object
              required: [full_name, phone, nationality, id_type, id_number]
              properties:
                full_name: {type: string}
                phone: {type: string, description: E.164}
                nationality: {type: string, description: ISO 3166-1 alpha-2}
                id_type: {type: string, enum: [KTP, SIM, PASSPORT, KITAS]}
                id_number: {type: string}
                special_request: {type: string}
            guests:
              type: array
              description: Exactly pax - 1 entries
              items:
                type: object
                required: [full_name]
                properties:
                  full_name: {type: string}
                  phone: {type: string}
            consents:
              type: object
              properties:
                terms: {type: boolean}
                cancellation: {type: boolean}
                deposit_forfeit: {type: boolean}
                data_processing: {type: boolean}
    PriceLine:
      type: object
      properties:
        kind: {type: string}
        label: {type: string}
        unit_price: {type: integer}
        quantity: {type: integer}
        amount: {type: integer}
        rule: {type: string, enum: [BASE, DATE, SEASON, WEEKEND, WEEKDAY]}
    Quote:
      type: object
      properties:
        mode: {type: string}
        boat_id: {type: string, format: uuid}
        route_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, example: Asia/Makassar}
        pax: {type: integer}
        lines: {type: array, items: {$ref: "#/components/schemas/PriceLine"}}
        discount:
          type: [object, "null"]
          properties: {promotion_id: {type: string}, name: {type: string}, code: {type: string}, amount: {type: integer}}
        subtotal: {type: integer}
        taxes:
          type: array
          items:
            type: object
            properties: {code: {type: string}, name: {type: string}, basis_points: {type: integer}, base: {type: integer}, amount: {type: integer}}
        tax_total: {type: integer}
        grand_total: {type: integer}
        payment:
          type: object
          properties:
            method: {type: string}
            scheme: {type: string, enum: [FULL, DEPOSIT]}
            deposit_available: {type: boolean}
            deposit_amount: {type: integer}
            principal_due_now: {type: integer}
            fee: {type: integer}
            total_due_now: {type: integer}
            balance_due_at: {type: [string, "null"], format: date-time}
            hold_minutes: {type: integer}
        usd_estimate: {type: integer}
        currency: {type: string, enum: [IDR]}
    Booking:
      type: object
      properties:
        id: {type: string, format: uuid, description: Public booking ID}
        booking_number: {type: string, example: H6KF08QST20N}
        invoice_number: {type: [string, "null"], example: INV/2026/000123}
        status: {$ref: "#/components/schemas/BookingStatus"}
        payment_status: {$ref: "#/components/schemas/BookingPaymentStatus"}
        mode: {type: string}
        boat_name: {type: string}
        route_name: {type: string}
        port_name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string}
        pax: {type: integer}
        subtotal: {type: integer}
        grand_total: {type: integer}
        amount_paid: {type: integer}
        fees_paid: {type: integer}
        amount_refunded: {type: integer}
        balance_due: {type: integer}
        payment_scheme: {type: string}
        deposit_amount: {type: integer}
        balance_due_at: {type: [string, "null"], format: date-time}
        hold_expires_at: {type: [string, "null"], format: date-time}
        actions:
          type: object
          additionalProperties: {type: boolean}
    PaymentCreateInput:
      type: object
      required: [method]
      properties:
        method: {$ref: "#/components/schemas/PaymentMethod"}
    ManualPaymentInput:
      type: object
      required: [method, amount, paid_on]
      properties:
        method: {type: string, enum: [BANK_TRANSFER, CASH]}
        amount: {type: integer, description: Must not exceed the outstanding balance}
        paid_on: {type: string, format: date}
        proof_media_id: {type: string, format: uuid}
        notes: {type: string}
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [FULL, DEPOSIT, BALANCE]}
        provider: {type: string, enum: [MIDTRANS, MANUAL]}
        method: {type: string}
        order_id: {type: string}
        principal_amount: {type: integer}
        fee_amount: {type: integer}
        gross_amount: {type: integer}
        status: {$ref: "#/components/schemas/PaymentStatus"}
        snap_token: {type: string}
        snap_redirect_url: {type: string}
        va_numbers: {type: array, items: {type: object}}
        expires_at: {type: [string, "null"], format: date-time}
        paid_at: {type: [string, "null"], format: date-time}
        is_exception: {type: boolean}
    MidtransNotification:
      type: object
      description: Midtrans HTTP notification. The signature is verified and the Status API is queried before any state change.
      required: [order_id, status_code, gross_amount, signature_key]
      properties:
        order_id: {type: string}
        status_code: {type: string}
        gross_amount: {type: string}
        signature_key: {type: string}
        transaction_status: {type: string}
    TrackInput:
      type: object
      required: [booking_number, email]
      properties:
        booking_number: {type: string}
        email: {type: string}
        turnstile_token: {type: string}
        locale: {type: string}
    Tracking:
      type: object
      description: Public view without names, phone numbers, identity numbers or guests.
      properties:
        id: {type: string, format: uuid}
        booking_number: {type: string}
        status: {$ref: "#/components/schemas/BookingStatus"}
        payment_status: {$ref: "#/components/schemas/BookingPaymentStatus"}
        starts_at: {type: string, format: date-time}
        timezone: {type: string}
        boat_name: {type: string}
        route_name: {type: string}
    Verification:
      type: object
      properties:
        valid: {type: boolean}
        status: {type: string}
        booking_number: {type: string}
        starts_at: {type: string, format: date-time}
        timezone: {type: string}
        boat_name: {type: string}
        pax: {type: integer}
        lead_name: {type: string, example: "J*** S****"}
